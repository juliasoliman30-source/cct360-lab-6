<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reading Nook | Contact</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">The Reading Nook</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container">
        <h1>Contact Julia</h1>
        <p>Ask about my recommendations or get a personalized reading list curated just for you!</p>

        <form class="row g-3" action="#" method="post">
        <div class="form-field md:col-6">
            <label for="contactFirstName" class="form-label">First name</label>
            <input type="text" class="form-control" id="contactFirstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div class="form-field md:col-6">
            <label for="contactLastName" class="form-label">Last name</label>
            <input type="text" class="form-control" id="contactLastName" name="lastName" autocomplete="family-name" required>
        </div>
        <div class="form-field md:col-6">
            <label for="contactEmail" class="form-label">Email address</label>
            <input type="email" class="form-control" id="contactEmail" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="form-field md:col-6">
            <label for="contactTopic" class="form-label">Purpose of Contact</label>
            <select class="form-control" id="contactTopic" name="topic">
                <option selected>Choose one…</option>
                <option value="bed">Sharing Opinion</option>
                <option value="volunteer">Personalized Reading List</option>
                <option value="workshop">Questions about Books</option>
            </select>
        </div>
        <div class="form-field col-12">
            <label for="contactMessage" class="form-label">Message</label>
            <textarea class="form-control" id="contactMessage" name="message" rows="4"></textarea>
        </div>
        <div class="form-field col-12">
            <input type="checkbox" id="contactConsent" name="consent" class="check" required>
            <label for="contactConsent">I consent to being contacted about my message</label>
        </div>
        <div class="col-12">
            <button class="btn-solid theme-primary" type="submit">Send message</button>
        </div>
        </form>
    </main>


    <footer class="container py-4 mt-5 border-top">
        <p class="fg-2 mb-0">&copy; 2026 The Reading Nook.</p>
    </footer>
    
</body>
</html>
